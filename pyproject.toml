[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-index"
version = "0.2.0"
description = "FM-index exact search + HNSW semantic search for codebases"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
semantic = ["hnswlib>=0.7"]
dev = ["pytest>=7.0", "hnswlib>=0.7", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
