[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "archaeo"
version = "0.1.0"
description = "Code archaeology and history analysis engine for the Ryzanstein LLM ecosystem"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
dependencies = [
    "GitPython>=3.1",
    "tree-sitter>=0.21",
    "httpx>=0.25",
    "pydantic>=2.5",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
