[package]
name = "ann-hybrid"
version = "0.1.0"
edition = "2021"
description = "Unified sub-linear search: HNSW + Cuckoo Filter + Count-Min Sketch"
license = "Apache-2.0"
repository = "https://github.com/iamthegreatdestroyer/Ryzanstein"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ann-hybrid"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
byteorder = "1"
thiserror = "1"
fnv = "1"
parking_lot = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
